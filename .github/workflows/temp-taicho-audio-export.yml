name: temp-taicho-audio-cleanup

on:
  push:
    paths:
      - '.github/workflows/temp-taicho-audio-export.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary audio bridge artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -rf tmp/taicho_audio_export || true
          git rm -f .github/workflows/temp-taicho-audio-export.yml || true
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'cleanup: remove temporary taicho audio export bridge'
          git push
