name: temp-taicho-audio-export

on:
  push:
    paths:
      - '.github/workflows/temp-taicho-audio-export.yml'
  workflow_dispatch:

permissions:
  contents: read

actions:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify narration
        shell: bash
        run: |
          set -euo pipefail
          test -s tmp/taicho_diary_ep1_narration.mp3
          sha256sum tmp/taicho_diary_ep1_narration.mp3
          wc -c tmp/taicho_diary_ep1_narration.mp3
      - name: Upload narration artifact
        uses: actions/upload-artifact@v4
        with:
          name: taicho-diary-ep1-narration
          path: tmp/taicho_diary_ep1_narration.mp3
          if-no-files-found: error
