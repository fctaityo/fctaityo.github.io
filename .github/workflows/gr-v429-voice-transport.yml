name: GR V429 Crisp Voice Byte Probe
on:
  push:
    branches: [gr-awakening-v429-voice-transport-20261023]
    paths: ['.github/workflows/gr-v429-voice-transport.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Recover MP3 directly from public preview
        run: |
          mkdir -p out
          curl --fail --location --retry 3 --max-time 60 --output out/246.mp3 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/a9ff1b9f-5b0f-4dcd-9fe8-afa1ab7a2cfd.mp3'
          file out/246.mp3
          test $(wc -c < out/246.mp3) -gt 5000
          file out/246.mp3
          sha256sum out/246.mp3
      - name: Upload MP3
        uses: actions/upload-artifact@v4
        with:
          name: gr-v429-crisp-source-246
          path: out/246.mp3
          retention-days: 1
