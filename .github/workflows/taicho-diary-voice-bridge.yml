name: Taicho Diary Voice Bridge

on:
  push:
    paths:
      - '.github/workflows/taicho-diary-voice-bridge.yml'

permissions:
  contents: write

jobs:
  bridge-voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download narration chunks
        run: |
          mkdir -p tmp/voice_chunks
          curl --fail --location --retry 5 --output tmp/voice_chunks/01.mp3 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/87117205-38c7-4cb1-b688-8a6414cbbbb7.mp3'
          curl --fail --location --retry 5 --output tmp/voice_chunks/02.mp3 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/ac6dd7af-cc21-4c84-970e-e3c574bcc777.mp3'
          curl --fail --location --retry 5 --output tmp/voice_chunks/03.mp3 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/4faa25c1-02b8-4f99-bac3-a8f91eed904e.mp3'
          curl --fail --location --retry 5 --output tmp/voice_chunks/04.mp3 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/738e68cf-d841-49d6-b25d-5e069b0cd295.mp3'
          curl --fail --location --retry 5 --output tmp/voice_chunks/05.mp3 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/e818dd5a-0fd5-4181-8e16-413b9060008a.mp3'
          for f in tmp/voice_chunks/*.mp3; do test -s "$f"; file "$f"; done
      - name: Assemble narration without ffmpeg
        run: |
          cat tmp/voice_chunks/01.mp3 tmp/voice_chunks/02.mp3 tmp/voice_chunks/03.mp3 tmp/voice_chunks/04.mp3 tmp/voice_chunks/05.mp3 > tmp/taicho_diary_ep1_narration.mp3
          test -s tmp/taicho_diary_ep1_narration.mp3
          file tmp/taicho_diary_ep1_narration.mp3
          wc -c tmp/taicho_diary_ep1_narration.mp3 > tmp/taicho_diary_ep1_narration.size.txt
          sha256sum tmp/taicho_diary_ep1_narration.mp3 > tmp/taicho_diary_ep1_narration.sha256
      - name: Commit bridged narration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f tmp/taicho_diary_ep1_narration.mp3 tmp/taicho_diary_ep1_narration.sha256 tmp/taicho_diary_ep1_narration.size.txt
          git commit -m 'chore: assemble Taicho Diary episode 1 narration'
          git push
