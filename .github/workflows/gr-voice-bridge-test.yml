        run: |
          mkdir -p out
          curl --fail --location --retry 3 --output out/046.mp3 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/1d2ee8b5-e079-4be9-a500-d82d94b01172.mp3'
          curl --fail --location --retry 3 --output out/047.mp3 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/d16418c9-02c4-4244-a1f3-0c84d78017a0.mp3'
