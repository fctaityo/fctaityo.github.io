name: GR Voice Bridge Transport Test

on:
  push:
    paths:
      - '.github/workflows/gr-voice-bridge-test.yml'

permissions:
  contents: read

jobs:
  transport-voice:
    runs-on: ubuntu-latest
    steps:
      - name: Download V276 awakening voices 066-085
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          download() {
            no="$1"
            url="$2"
            echo "Downloading ${no}"
            for attempt in $(seq 1 18); do
              if curl --fail --location --connect-timeout 20 --max-time 180 --retry 3 --retry-all-errors --retry-delay 3 --output "out/${no}.mp3.tmp" "$url"; then
                if test -s "out/${no}.mp3.tmp" && file "out/${no}.mp3.tmp" | grep -Eiq 'audio|MPEG|MP3'; then
                  mv "out/${no}.mp3.tmp" "out/${no}.mp3"
                  return 0
                fi
              fi
              rm -f "out/${no}.mp3.tmp"
              sleep 10
            done
            echo "FAILED ${no}" >&2
            return 1
          }
          download 066 'https://www.aidocmaker.com/g0/audio?name=f128969d004c44409cb27e475e157dc2'
          download 067 'https://www.aidocmaker.com/g0/audio?name=f2c08401d7c24e798b6e5aecd8603f99'
          download 068 'https://www.aidocmaker.com/g0/audio?name=adb4102d681843a8be3329ac29f28334'
          download 069 'https://www.aidocmaker.com/g0/audio?name=5848859a5baf4efc97796cd667969fed'
          download 070 'https://www.aidocmaker.com/g0/audio?name=74e83e7f661e45209f261ca5c5c5eaba'
          download 071 'https://www.aidocmaker.com/g0/audio?name=cda01798373443ccac0421f978541f01'
          download 072 'https://www.aidocmaker.com/g0/audio?name=437eb603e8e146928edd3b8b093a94c8'
          download 073 'https://www.aidocmaker.com/g0/audio?name=b1c4c2b343b64b96b3f56ad2bf858936'
          download 074 'https://www.aidocmaker.com/g0/audio?name=79b7f78ad2dc4e3d992cae65144bcfa8'
          download 075 'https://www.aidocmaker.com/g0/audio?name=e988149b8045490e81f6e93ae740fa69'
          download 076 'https://www.aidocmaker.com/g0/audio?name=4e5df731ae5c434bb1c1228899484d40'
          download 077 'https://www.aidocmaker.com/g0/audio?name=541eb8a5c4594f0e9a199bf5832b2263'
          download 078 'https://www.aidocmaker.com/g0/audio?name=fbbdc9694638488f8f79e1c1ce33366e'
          download 079 'https://www.aidocmaker.com/g0/audio?name=673d6f6346824d2098926a2119d9493f'
          download 080 'https://www.aidocmaker.com/g0/audio?name=bb214921189942b382e4df8a95af27f8'
          download 081 'https://www.aidocmaker.com/g0/audio?name=a9e803f1b8614c0ea210b4e4762c2c15'
          download 082 'https://www.aidocmaker.com/g0/audio?name=e8d899a85b3247f7a59275fda50917ea'
          download 083 'https://www.aidocmaker.com/g0/audio?name=2b86db055f90454395e907477923ce28'
          download 084 'https://www.aidocmaker.com/g0/audio?name=f500471b25464eebbe5c171665165698'
          download 085 'https://www.aidocmaker.com/g0/audio?name=7a4d75b70fbb4624af79b98b56e632da'
          sha256sum out/*.mp3 > out/SHA256SUMS.txt
          file out/*.mp3
      - name: Upload V276 voice artifact
        uses: actions/upload-artifact@v4
        with:
          name: gr-awakening-voice-v276-066-085
          path: out/
          retention-days: 1
