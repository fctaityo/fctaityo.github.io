name: GR Voice Bridge Transport Test

on:
  push:
    paths:
      - '.github/workflows/gr-voice-bridge-test.yml'

permissions:
  contents: read

jobs:
  transport-voice:
    runs-on: ubuntu-latest
    steps:
      - name: Download generated voice 001
        run: |
          mkdir -p out
          curl --fail --location --retry 3 --output out/001.mp3 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/18f4d358-cdc1-47fe-b3db-9495119b49d0.mp3'
          test -s out/001.mp3
          file out/001.mp3
          sha256sum out/001.mp3 > out/001.sha256
      - name: Upload voice artifact
        uses: actions/upload-artifact@v4
        with:
          name: gr-awakening-voice-001
          path: |
            out/001.mp3
            out/001.sha256
          retention-days: 1
