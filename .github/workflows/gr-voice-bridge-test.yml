name: GR Voice Bridge Transport Test

on:
  push:
    paths:
      - '.github/workflows/gr-voice-bridge-test.yml'

permissions:
  contents: read

jobs:
  transport-voice:
    runs-on: ubuntu-latest
    steps:
      - name: Download regenerated voice 020
        run: |
          mkdir -p out
          curl --fail --location --retry 3 --output out/020.mp3 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/4fb908b6-c399-40af-831e-c6b2786ad10b.mp3'
          test -s out/020.mp3
          file out/020.mp3
          sha256sum out/020.mp3 > out/020.sha256
      - name: Upload voice artifact
        uses: actions/upload-artifact@v4
        with:
          name: gr-awakening-voice-020-v271r
          path: out/
          retention-days: 1
