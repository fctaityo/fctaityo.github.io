name: GR Voice Bridge Transport Test

on:
  push:
    paths:
      - '.github/workflows/gr-voice-bridge-test.yml'

permissions:
  contents: read

jobs:
  transport-voice:
    runs-on: ubuntu-latest
    steps:
      - name: Download generated awakening voices 002 007-025
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          curl --fail --location --retry 3 --output out/002.mp3 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/c7405f19-1df5-412a-998f-341a2d81a87a.mp3'
          curl --fail --location --retry 3 --output out/007.mp3 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/1e205346-582d-40a0-839a-ca81cc11db5a.mp3'
          curl --fail --location --retry 3 --output out/008.mp3 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/97a9fed0-c15e-40a4-9176-18be6b384e55.mp3'
          curl --fail --location --retry 3 --output out/009.mp3 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/d51b66cc-bd4c-449e-9b92-38cd1afd33f4.mp3'
