name: GR Voice Bridge Transport Test

on:
  push:
    paths:
      - '.github/workflows/gr-voice-bridge-test.yml'

permissions:
  contents: read

jobs:
  transport-voice:
    runs-on: ubuntu-latest
    steps:
      - name: Download generated voices 146-165
        run: |
          mkdir -p out
          curl --fail --location --retry 3 --output out/146.mp3 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/b0d299da-f6c3-451b-9b8c-275dea63b0c8.mp3'
          curl --fail --location --retry 3 --output out/147.mp3 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/dff4b7e4-2547-4629-8a7e-1a80aaa7de5b.mp3'
          curl --fail --location --retry 3 --output out/148.mp3 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/ce4261c5-a6c5-4a63-9ec3-ec89799af500.mp3'
          curl --fail --location --retry 3 --output out/149.mp3 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/090ff8d7-ba2a-4d5b-983c-bf94845125ca.mp3'
