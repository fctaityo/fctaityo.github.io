name: GR Voice Bridge Transport Test

on:
  push:
    paths:
      - '.github/workflows/gr-voice-bridge-test.yml'

permissions:
  contents: read

jobs:
  transport-voice:
    runs-on: ubuntu-latest
    steps:
      - name: Download V276 awakening voice previews 066-085
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          download() {
            no="$1"
            url="$2"
            curl --fail --location --retry 3 --retry-all-errors --output "out/${no}.mp3" "$url"
            test -s "out/${no}.mp3"
            file "out/${no}.mp3" | grep -Eiq 'MPEG|MP3|Audio'
          }
          download 066 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/168dc9b9-f5f4-48a6-8541-5f35e976ef53.mp3'
          download 067 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/188db80c-bb9c-4d8e-93a3-d10cb1556ff0.mp3'
          download 068 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/b8eb659d-87f8-4556-9fb1-84b41f56ff74.mp3'
          download 069 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/c3bda44b-be27-4e8c-8df1-662180ac504f.mp3'
          download 070 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/84b27d6b-9d65-47a4-95de-af5733206c87.mp3'
          download 071 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/2976e3ef-d394-42b9-ac82-6212cead3e0b.mp3'
          download 072 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/38a35ead-7ffe-4099-9b14-de92bab259b8.mp3'
          download 073 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/f17b46bb-d867-43e5-a737-945d88cca3ea.mp3'
          download 074 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/ea3ad13f-88c3-4dff-868c-8eebc465d676.mp3'
          download 075 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/8c977429-9c98-42e7-9574-52a7b6df6cb2.mp3'
          download 076 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/cf04074b-6d81-457e-8e1c-5793ae7d425a.mp3'
          download 077 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/a71d76e5-2d60-4cc3-81f7-5e4e9e8f35f7.mp3'
          download 078 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/f24cf821-0414-4d56-a034-ae90167125ed.mp3'
          download 079 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/609db248-77bc-463c-a925-1e00b8977cee.mp3'
          download 080 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/4452fe44-aef3-4457-af2f-7c4862cf1106.mp3'
          download 081 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/27f0cfa6-85fa-43e2-bfc0-b093c4917017.mp3'
          download 082 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/293f725a-ef6d-4e62-b088-1c8bcc6715ed.mp3'
          download 083 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/48c565fe-3c05-4fd0-8ddb-98b64261448e.mp3'
          download 084 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/9fee8469-4f1d-4ab0-b963-d310a23769f9.mp3'
          download 085 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/8aa9a05c-8528-4ac4-8406-c00f9a81e226.mp3'
          sha256sum out/*.mp3 > out/SHA256SUMS.txt
          file out/*.mp3
      - name: Upload V276 voice artifact
        uses: actions/upload-artifact@v4
        with:
          name: gr-awakening-voice-v276-066-085-direct
          path: out/
          retention-days: 1
