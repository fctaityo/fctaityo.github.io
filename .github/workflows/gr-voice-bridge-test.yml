name: GR Voice Bridge Transport Test

on:
  push:
    paths:
      - '.github/workflows/gr-voice-bridge-test.yml'

permissions:
  contents: read

jobs:
  transport-voice:
    runs-on: ubuntu-latest
    steps:
      - name: Download generated awakening voices 026-045
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          curl --fail --location --retry 3 --output out/026.mp3 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/47d3b1b2-8b80-4555-a84b-63289bc72da6.mp3'
          curl --fail --location --retry 3 --output out/027.mp3 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/c0f160a3-95bd-40da-b706-42a9464e68cd.mp3'
